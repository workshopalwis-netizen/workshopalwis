<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <linearGradient id="p5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="40%" stop-color="#190e30"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <radialGradient id="phoneGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="1280" fill="url(#p5Grad)"/>
  <circle cx="360" cy="500" r="380" fill="url(#phoneGlow)"/>

  <!-- Social UI Elements / Hook Graphics -->
  <g transform="translate(360, 480)">
    <!-- Hook Badge -->
    <rect x="-240" y="-180" width="480" height="64" rx="32" fill="#8b5cf6"/>
    <text x="0" y="-140" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="2">🔥 THE 3-SECOND RULE</text>

    <!-- Kinetic Subtitle Frame -->
    <rect x="-280" y="-40" width="560" height="120" rx="16" fill="rgba(0,0,0,0.7)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="34" fill="#ffffff">STOP SCROLLING.</text>
    <text x="0" y="55" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-weight="800" font-size="24" fill="#38bdf8">WATCH THIS BREAKDOWN.</text>

    <!-- Soundwave indicator -->
    <g transform="translate(-100, 120)">
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="-30" x2="20" y2="30" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="-10" x2="40" y2="10" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <line x1="60" y1="-40" x2="60" y2="40" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
      <line x1="80" y1="-25" x2="80" y2="25" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
      <line x1="100" y1="-15" x2="100" y2="15" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title & Info -->
  <text x="60" y="1080" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="44" fill="#ffffff">APEX SOCIAL</text>
  <text x="60" y="1120" font-family="'Archivo Black', sans-serif" font-size="16" fill="#ec4899" letter-spacing="3">HIGH-RETENTION VERTICAL REELS</text>
  <rect x="60" y="1145" width="220" height="3" fill="#ec4899"/>
</svg>
