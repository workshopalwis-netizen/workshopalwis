<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <rect width="1280" height="720" fill="#18181b"/>
  <!-- Wireframe & unshaded vector lines -->
  <g stroke="#71717a" stroke-width="1.5" fill="none">
    <line x1="0" y1="360" x2="1280" y2="360" stroke-dasharray="4 4"/>
    <line x1="640" y1="0" x2="640" y2="720" stroke-dasharray="4 4"/>
    <rect x="100" y="100" width="1080" height="520" stroke="#3f3f46"/>
  </g>

  <g transform="translate(640, 360)">
    <polygon points="0,-160 160,-80 0,0 -160,-80" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <polygon points="-160,-80 0,0 0,160 -160,80" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <polygon points="0,0 160,-80 160,80 0,160" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
  </g>

  <text x="80" y="580" font-family="'Archivo Black', sans-serif" font-weight="700" font-size="44" fill="#a1a1aa">RAW VECTOR CHOP</text>
  <text x="80" y="620" font-family="'Archivo Black', sans-serif" font-size="16" fill="#71717a">PRE-COMPOSITE • UNGRADED STAGE</text>
</svg>
