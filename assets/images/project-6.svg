<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="60%" stop-color="#21103a"/>
      <stop offset="100%" stop-color="#3b1d54"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="640" cy="300" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- Glowing VFX Monolith Portal -->
  <circle cx="640" cy="300" r="260" fill="url(#portalGlow)"/>

  <!-- Monolith Geometry -->
  <polygon points="640,120 720,440 640,480 560,440" fill="#0c0717" stroke="#38bdf8" stroke-width="2"/>
  <line x1="640" y1="120" x2="640" y2="480" stroke="#a855f7" stroke-width="2"/>

  <!-- Ground Landscape Silhouettes -->
  <path d="M 0 540 Q 300 480 640 520 T 1280 500 L 1280 720 L 0 720 Z" fill="#05030a"/>

  <!-- Particle Sparks -->
  <circle cx="580" cy="240" r="3" fill="#ffffff"/>
  <circle cx="700" cy="200" r="4" fill="#38bdf8"/>
  <circle cx="620" cy="180" r="2.5" fill="#a855f7"/>
  <circle cx="670" cy="340" r="3.5" fill="#38bdf8"/>

  <text x="80" y="580" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">ANOMALY VFX</text>
  <text x="80" y="620" font-family="'Archivo Black', sans-serif" font-size="16" fill="#38bdf8" letter-spacing="4">VFX ENVIRONMENT &amp; 3D MATCHMOVE</text>
  <rect x="80" y="645" width="280" height="3" fill="#38bdf8"/>
</svg>
