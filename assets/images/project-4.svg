<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090814"/>
      <stop offset="60%" stop-color="#180e2b"/>
      <stop offset="100%" stop-color="#0b0617"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#p4Grad)"/>

  <!-- Kinetic Typography Layers in 3D Perspective -->
  <g transform="translate(640, 280) rotate(-6)">
    <text x="0" y="-80" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="96" fill="rgba(255,255,255,0.06)" letter-spacing="12">CHOREOGRAPHY</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="110" fill="#ffffff" letter-spacing="6">IN MOTION</text>
    <text x="0" y="110" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="80" fill="#a855f7" letter-spacing="16">TYPOGRAPHY</text>

    <!-- Glowing accent box -->
    <rect x="-340" y="-45" width="680" height="85" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="16 8"/>
  </g>

  <text x="80" y="580" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">SYNTAX</text>
  <text x="80" y="620" font-family="'Archivo Black', sans-serif" font-size="16" fill="#a855f7" letter-spacing="4">KINETIC TYPOGRAPHY PIECE • AFTER EFFECTS</text>
  <rect x="80" y="645" width="280" height="3" fill="#a855f7"/>
</svg>
